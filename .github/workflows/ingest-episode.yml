name: Ingest Episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number to ingest into search index"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download existing search index
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node --import tsx ./scripts/download-search-data.ts

      # Fetch the latest transcript from Blob (may have speaker mapping
      # edits that aren't in git yet).
      - name: Download transcript from Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/download-blob-transcript.ts "$EPISODE"

      - name: Ingest episode ${{ inputs.episode }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/ingest.ts --episode "$EPISODE"

      - name: Upload updated search index
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node --import tsx ./scripts/upload-search-data.ts

      # Tier 2: derive metadata proposals from the now speaker-mapped transcript.
      # Writes proposals to Blob only — never to the sheet. Non-fatal.
      - name: Generate Tier 2 proposals
        id: tier2
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/generate-proposals.ts --episode="$EPISODE"

      # Announce that the episode is now searchable (speaker mapping + cleanup
      # complete). Non-fatal — never blocks the deploy.
      - name: Notify Discord — episode ingested
        continue-on-error: true
        env:
          DISCORD_PDC_WEBHOOK_URL: ${{ secrets.DISCORD_PDC_WEBHOOK_URL }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/notify-discord.ts --event=ingested --episode="$EPISODE"

      # Announce that Tier 2 proposals are waiting for review — otherwise
      # nothing tells a human that proposals piled up in Blob. Only fires
      # when the previous step actually produced proposals.
      - name: Notify Discord — Tier 2 proposals ready
        if: steps.tier2.outputs.proposal_count > 0
        continue-on-error: true
        env:
          DISCORD_PDC_WEBHOOK_URL: ${{ secrets.DISCORD_PDC_WEBHOOK_URL }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/notify-discord.ts --event=proposals-ready --episode="$EPISODE" --count="${{ steps.tier2.outputs.proposal_count }}" --film="${{ steps.tier2.outputs.proposal_film }}"

      # Open the episode for Notable Moment nominations in #engineers.
      # Needs its own webhook: the PDC webhook is scoped to #pod-data-central.
      - name: Notify Discord — notes open
        continue-on-error: true
        env:
          DISCORD_ENGINEERS_WEBHOOK_URL: ${{ secrets.DISCORD_ENGINEERS_WEBHOOK_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          EPISODE: ${{ inputs.episode }}
        run: node --import tsx ./scripts/notify-discord.ts --event=notes-open --episode="$EPISODE"

      - name: Trigger deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -sf -X POST "$VERCEL_DEPLOY_HOOK_URL" || echo "Deploy hook trigger failed (non-fatal)"
            echo "Triggered Vercel deploy."
          fi
