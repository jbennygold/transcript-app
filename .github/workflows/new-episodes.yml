name: Check New Episodes

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 2 PM UTC (9 AM ET)
  workflow_dispatch:
    inputs:
      include_backfill:
        description: "Include historical backfill episodes (not just recent/new)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Transcription polling can take 60min

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for new episodes
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PATREON_CREATOR_TOKEN: ${{ secrets.PATREON_CREATOR_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INCLUDE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_backfill || 'false' }}
        run: |
          if [ "$INCLUDE_BACKFILL" = "true" ]; then
            node --import tsx ./scripts/check-new-episodes.ts --verbose --include-backfill
          else
            node --import tsx ./scripts/check-new-episodes.ts --verbose
          fi

      # Ingest is NOT run here — transcripts are unmapped (placeholder speakers)
      # at this point. Ingest happens after speaker mapping via "Publish to Search"
      # in the review UI, which triggers the ingest-episode workflow.

      - name: Regenerate legacy data/episode-metadata.json
        run: node --import tsx ./scripts/sync-legacy-metadata-json.ts

      # Commit metadata + any new transcripts downloaded from Blob
      - name: Commit metadata and transcript changes
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GOOGLE_SERVICE_ACCOUNT_KEY_FILE: /tmp/gcp-sa-key.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/metadata-data.ts data/episode-metadata.json
          git add transcripts/episode_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(metadata): sync sheet metadata"

          # Transcription can run 60+ min; another push may have landed during
          # that window. Try a fast-path rebase first.
          if git pull --rebase origin master && git push origin HEAD:master; then
            echo "Pushed via fast-path rebase."
            echo "CHANGES_COMMITTED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Recovery path: rebase failed. Almost always because a parallel
          # sync run rewrote the auto-generated src/lib/metadata-data.ts and
          # the auto-merger can't reconcile the two writes. We save the
          # transcripts we just downloaded (those can't be regenerated),
          # reset to remote, restore them, then regenerate the auto-generated
          # metadata on top of the fresh master and push as a new commit.
          echo "Fast-path push failed; recovering from rebase conflict..."
          git rebase --abort 2>/dev/null || true

          mkdir -p /tmp/rescue-transcripts
          cp -a transcripts/episode_*.json /tmp/rescue-transcripts/ 2>/dev/null || true

          git fetch origin master
          git reset --hard origin/master

          for f in /tmp/rescue-transcripts/episode_*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ ! -f "transcripts/$base" ]; then
              cp "$f" "transcripts/$base"
              echo "Restored $base from rescue."
            fi
          done

          # The previous step's shim writes the service account key to
          # /tmp/gcp-sa-key.json; recreate it here if it's gone.
          if [ ! -f /tmp/gcp-sa-key.json ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > /tmp/gcp-sa-key.json
            chmod 600 /tmp/gcp-sa-key.json
          fi

          node --import tsx ./scripts/sync-metadata.ts
          node --import tsx ./scripts/sync-legacy-metadata-json.ts

          git add src/lib/metadata-data.ts data/episode-metadata.json
          git add transcripts/episode_*.json
          if git diff --cached --quiet; then
            echo "Recovery: nothing left to commit (remote already had everything)."
            exit 0
          fi
          git commit -m "chore(metadata): sync sheet metadata (post-conflict recovery)"
          git push origin HEAD:master
          echo "CHANGES_COMMITTED=true" >> "$GITHUB_ENV"

      # Announce freshly-transcribed episodes that now need speaker mapping.
      # Non-fatal: the script exits 0 if the webhook secret is unset or the
      # POST fails, so notification problems never block the deploy.
      - name: Notify Discord — episodes need speaker mapping
        if: hashFiles('transcribed-episodes.txt') != ''
        continue-on-error: true
        env:
          DISCORD_PDC_WEBHOOK_URL: ${{ secrets.DISCORD_PDC_WEBHOOK_URL }}
        run: node --import tsx ./scripts/notify-discord.ts --event=needs-mapping

      # On a manual trigger (/pdc-check-episodes) that transcribed nothing, confirm
      # "no new episodes" so the person who ran it gets a result instead of silence.
      # Scheduled cron runs stay silent to avoid a daily "nothing new" ping.
      - name: Notify Discord — no new episodes (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && hashFiles('transcribed-episodes.txt') == ''
        continue-on-error: true
        env:
          DISCORD_PDC_WEBHOOK_URL: ${{ secrets.DISCORD_PDC_WEBHOOK_URL }}
        run: node --import tsx ./scripts/notify-discord.ts --event=no-new-episodes

      # Surface episodes whose sheet Film title matched no Drive folder, so a
      # typo is visible in Discord rather than buried in the job summary.
      - name: Notify Discord — unresolved Drive folders
        if: hashFiles('unresolved-episodes.json') != ''
        continue-on-error: true
        env:
          DISCORD_PDC_WEBHOOK_URL: ${{ secrets.DISCORD_PDC_WEBHOOK_URL }}
        run: node --import tsx ./scripts/notify-discord.ts --event=drive-unresolved

      # Deploy so the build picks up the new metadata + the updated search
      # index that was just uploaded to Blob.
      - name: Trigger deploy
        if: env.CHANGES_COMMITTED == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -sf -X POST "$VERCEL_DEPLOY_HOOK_URL" || echo "Deploy hook trigger failed (non-fatal)"
            echo "Triggered Vercel deploy."
          fi
